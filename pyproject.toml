[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl-fin-gen"
version = "0.1.0.dev0"
description = "Controlled Finnish text generation for education and research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=3.46,<4"]

[project.scripts]
ctrl-fin-gen = "ctrl_fin_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
